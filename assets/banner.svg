<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="40%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6"/>
    </linearGradient>

    <linearGradient id="pulse-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="pulse-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <style>
      .orb-1 {
        animation: floatOrb1 10s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 8s ease-in-out infinite alternate;
      }
      .pill-float-1 {
        animation: floatPill1 6s ease-in-out infinite alternate;
      }
      .pill-float-2 {
        animation: floatPill2 7s ease-in-out infinite alternate;
      }
      .pulse-line {
        stroke-dasharray: 8 12;
        animation: dashMove 20s linear infinite;
      }
      .retry-ring {
        transform-origin: 1040px 100px;
        animation: rotateRing 12s linear infinite;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
        100% { transform: translate(60px, 40px) scale(1.15); opacity: 0.45; }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0) scale(1); opacity: 0.2; }
        100% { transform: translate(-50px, -30px) scale(1.2); opacity: 0.35; }
      }
      @keyframes floatPill1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-12px); }
      }
      @keyframes floatPill2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(14px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -1000; }
      }
      @keyframes rotateRing {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bg-grad)"/>

  <!-- Subtle Blueprint Tech Grid Background -->
  <g opacity="0.12">
    <line x1="0" y1="70" x2="1200" y2="70" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="140" x2="1200" y2="140" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="210" x2="1200" y2="210" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="280" x2="1200" y2="280" stroke="#38bdf8" stroke-width="1"/>
    <line x1="0" y1="350" x2="1200" y2="350" stroke="#38bdf8" stroke-width="1"/>
    <line x1="150" y1="0" x2="150" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="750" y1="0" x2="750" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="420" stroke="#38bdf8" stroke-width="1"/>
    <line x1="1050" y1="0" x2="1050" y2="420" stroke="#38bdf8" stroke-width="1"/>
  </g>

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <g filter="url(#glow)">
    <circle class="orb-1" cx="200" cy="120" r="140" fill="#38bdf8"/>
    <circle class="orb-2" cx="1020" cy="300" r="160" fill="#818cf8"/>
    <circle class="orb-1" cx="600" cy="380" r="130" fill="#c084fc"/>
  </g>

  <!-- Animated Dynamic Ambient Lines (Background layer) -->
  <path class="pulse-line" d="M -50,320 Q 300,380 600,310 T 1250,330" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3"/>
  <path class="pulse-line" d="M -50,100 Q 400,40 800,120 T 1250,80" fill="none" stroke="#818cf8" stroke-width="2" opacity="0.25"/>

  <!-- Dynamic Decorative Icons/Rings in corner (Kept away from center text) -->
  <g class="retry-ring" opacity="0.35">
    <circle cx="1040" cy="100" r="50" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="15 25"/>
    <circle cx="1040" cy="100" r="30" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="10 15"/>
  </g>

  <!-- Background Decorative Pills Floating Off-Center -->
  <g class="pill-float-1" transform="translate(930, 240)">
    <rect width="190" height="38" rx="19" fill="#1e293b" stroke="#10b981" stroke-width="1.5" opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#10b981"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Smart Retry: +57%</text>
  </g>

  <g class="pill-float-2" transform="translate(70, 60)">
    <rect width="180" height="38" rx="19" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" opacity="0.85"/>
    <circle cx="20" cy="19" r="6" fill="#38bdf8"/>
    <text x="36" y="24" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">Zero Churn Engine</text>
  </g>

  <!-- ================= FOREGROUND CONTENT (ALWAYS CRISP & UNCLUTTERED) ================= -->
  
  <!-- Awesome Badge Top Foreground -->
  <g transform="translate(600, 78)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="-116" cy="0" r="5" fill="#38bdf8"/>
    <text x="-98" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="1.5">CURATED ECOSYSTEM DIRECTORY</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" fill="url(#text-grad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="800" letter-spacing="-1">
    Awesome Dunning &amp; Payment Recovery
  </text>

  <!-- Subtitle -->
  <text x="600" y="215" text-anchor="middle" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="400">
    Smart Retries • Involuntary Churn Prevention • Self-Hosted &amp; SaaS Billing Infrastructure
  </text>

  <!-- Tagline / Metrics Indicator -->
  <text x="600" y="252" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500">
    Recovering Up to 55%+ of Soft Declines • Eliminating Subscription Revenue Leakage
  </text>

  <!-- Feature Tags / Capabilities Bar in Foreground -->
  <g transform="translate(600, 310)">
    <!-- Tag 1 -->
    <g transform="translate(-360, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="21" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Machine Learning Retries</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(-180, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="21" text-anchor="middle" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💳 Card Account Updaters</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(5, 0)">
      <rect x="0" y="0" width="175" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="87" y="21" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🛡️ Involuntary Churn Shield</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(195, 0)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="82" y="21" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔓 Open-Source Engines</text>
    </g>
  </g>

  <!-- Border Outline -->
  <rect width="1200" height="420" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>
</svg>
